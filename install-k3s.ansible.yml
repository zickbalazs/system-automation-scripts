---
- name: Install k3s into webserver network
  hosts: webservers
  remote_user: alpine

  tasks:
    - name: Ensure packages are installed
      become: true
      become_method: doas
      become_user: root
      ansible.builtin.package:
        name:
          - k3s
          - helm
          - podman
        state: latest
    - name: start