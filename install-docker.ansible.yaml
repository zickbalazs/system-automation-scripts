- name: Ensure Docker is installed on host
  hosts: gameservers
  remote_user: server
  tasks:
    - name: Install ca-certificates and curl
      ansible.builtin.apt:
        pkg:
          - ca-certificates
          - curl
        update_cache: true
    - name: Install docker's keyring
      ansible.builtin.command: install -m 0755 -d /etc/apt/keyrings
      become: true
      register: keyring_installation_result
      changed_when: keyring_installation_result.rc != 0
    - name: Curl GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: a+r
      become: true
      register: curl_output
      changed_when: curl_output.rc != 0
    - name: Modify keyring for read permissions
      ansible.builtin.command: chmod a+r /etc/apt/keyring/docker.asc
      become: true
      register: read_permissions_result
      changed_when: read_permissions_result.rc != 0
    - name: Add repository for sources.list
      ansible.builtin.script: ./scripts/addDockerToRepos.sh
      register: add_repo_result
      changed_when: add_repo_result.rc != 0
    - name: Install docker
      ansible.builtin.apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: true
      become: true
